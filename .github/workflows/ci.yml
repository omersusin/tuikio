# Tests, catalog validation, native build and a debug APK on every push and pull request.
# No secrets are used here: release signing never happens in public CI (docs/RELEASE.md).
name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM tests + catalog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (terminal, controls, catalog, community, backend)
        run: ./gradlew --no-daemon :core:terminal:test :core:controls:test :core:catalog:test :core:community:test :backend:test
      - name: Validate catalog
        run: ./gradlew --no-daemon :tools:catalog-cli:run --args="validate $GITHUB_WORKSPACE/catalog"
      - name: README credits match the catalog
        run: python3 tools/catalog/gen_credits.py --check

  native:
    name: Native games (3 ABIs) + runtime tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toolchain (pinned zig; qemu for arm smoke tests; flex, bison and ncurses for host-generated game data)
        run: |
          pip install ziglang==0.17.0
          echo "ZIG=$(python -c 'import ziglang, os; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')" >> "$GITHUB_ENV"
          sudo apt-get update && sudo apt-get install -y qemu-user-static flex bison libncurses-dev
      - name: Rust (pinned, with the musl targets of the three ABIs)
        run: |
          rustup toolchain install 1.97.0 --profile minimal \
            --target aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf,x86_64-unknown-linux-musl
          rustup default 1.97.0
      - uses: actions/cache@v4
        with:
          path: native/.cache
          key: native-sources-${{ hashFiles('native/sources.lock.json') }}
      - name: Build (sources verified against native/sources.lock.json)
        run: python3 native/build.py
      - name: PTY smoke tests
        run: |
          python3 native/tests/pty_smoke.py native/build/out/x86_64
          python3 native/tests/pty_smoke.py native/build/out/arm64-v8a qemu-aarch64-static
          python3 native/tests/pty_smoke.py native/build/out/armeabi-v7a qemu-arm-static
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Runtime tests against the real game binaries
        run: ./gradlew --no-daemon :core:runtime:test -PrequireNative
      - uses: actions/upload-artifact@v4
        with:
          name: native-out
          path: native/build/out
          retention-days: 7

  apk:
    name: Debug APK
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-out
          path: native/build/out
      - name: Restore executable bits lost by the artifact round trip
        run: find native/build/out -name '*.so' -exec chmod 755 {} +
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: UI tests (Robolectric, driving the real x86_64 games)
        run: ./gradlew --no-daemon :app:test
      - name: Build and verify
        run: |
          ./gradlew --no-daemon :app:assembleDebugApk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/tuikio-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tuikio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
