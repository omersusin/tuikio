<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Blink, the cursor sprite (alternative concept)</title>
  <ellipse cx="100" cy="186" rx="58" ry="7" fill="#1E1A3A" opacity="0.12"/>
  <!-- cursor antenna, mid-blink glow -->
  <circle cx="104" cy="36" r="22" fill="#FFC93C" opacity="0.28"/>
  <rect x="94" y="16" width="20" height="40" rx="7" transform="rotate(10 104 36)" fill="#FFC93C" stroke="#1E1A3A" stroke-width="6"/>
  <!-- body: one soft terminal cell -->
  <rect x="44" y="58" width="112" height="112" rx="36" fill="#2BD9A0" stroke="#1E1A3A" stroke-width="6"/>
  <!-- belly highlight -->
  <path d="M62 92 C62 78 72 72 84 72" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <!-- block eyes (two cursor cells) -->
  <rect x="74" y="98" width="13" height="24" rx="5" fill="#1E1A3A"/>
  <rect x="113" y="98" width="13" height="24" rx="5" fill="#1E1A3A"/>
  <rect x="77" y="101" width="5" height="7" rx="2" fill="#FFFFFF"/>
  <rect x="116" y="101" width="5" height="7" rx="2" fill="#FFFFFF"/>
  <!-- mouth -->
  <path d="M90 136 Q95 142 100 136 Q105 142 110 136" fill="none" stroke="#1E1A3A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="68" cy="134" rx="7" ry="4.5" fill="#9FF0D2"/>
  <ellipse cx="132" cy="134" rx="7" ry="4.5" fill="#9FF0D2"/>
  <!-- stubby arms -->
  <path d="M44 128 C32 126 28 116 32 108" fill="none" stroke="#1E1A3A" stroke-width="6" stroke-linecap="round"/>
  <path d="M156 128 C168 130 172 140 168 148" fill="none" stroke="#1E1A3A" stroke-width="6" stroke-linecap="round"/>
  <!-- feet -->
  <rect x="68" y="166" width="24" height="14" rx="7" fill="#1E1A3A"/>
  <rect x="108" y="166" width="24" height="14" rx="7" fill="#1E1A3A"/>
</svg>
